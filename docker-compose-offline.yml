# ============================================================
# SmartFan 智能风扇控制器 - 离线版 Docker Compose
# 特点：不需要 NAS 联网，不需要构建（no build）
# 前提：镜像 smartfan:latest 已通过 docker load 导入
# ============================================================

services:
  smartfan:
    # 容器名称
    container_name: smartfan

    # 直接使用已导入的本地镜像（不构建，不走网络）
    image: smartfan:latest

    # 自动重启策略
    restart: always

    # 端口映射：宿主机8780 -> 容器8780
    ports:
      - "8780:8780"

    # ============================================================
    # USB 串口设备映射（二选一，推荐方式一）
    # ============================================================
    # 方式一（推荐）：特权模式，自动识别所有 /dev/ttyACM* 设备
    privileged: true

    # 方式二（更安全）：指定具体设备（取消注释下面两行，按实际设备名）
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"

    # ============================================================
    # 数据持久化卷
    # ============================================================
    volumes:
      - smartfan-data:/app

    # ============================================================
    # 环境变量
    # ============================================================
    environment:
      - TZ=Asia/Shanghai

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-s", "-m", "3", "http://127.0.0.1:8780/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 日志限制
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# ============================================================
# 命名卷定义
# ============================================================
volumes:
  smartfan-data:
    driver: local
