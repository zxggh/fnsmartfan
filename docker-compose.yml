# ============================================================
# SmartFan 智能风扇控制器 - Docker Compose 远程镜像版
#
# 特性：
#   ✅ image 直接指向 ghcr.io / docker.io 等远程镜像仓库
#   ✅ 每次 compose up 时自动拉最新（飞牛 Compose 支持 pull_policy 时）
#   ✅ 完全不用再导入/导出 tar，更新就两步：Push → NAS 点"重新拉取+重启"
#
# ⚠ 当前仓库真实镜像地址（Actions 构建成功后自动推送）：
#    主镜像 (GHCR) : ghcr.io/zxggh/fnsmartfan:latest
#    DockerHub     : docker.io/<你的用户名>/fnsmartfan:latest
#    私有镜像      : registry.example.com/<你的用户名>/fnsmartfan:latest
# ============================================================

services:
  smartfan:
    container_name: smartfan

    # ============================================================
    # 远程镜像地址：默认已填好本仓库 GHCR 地址
    # 只保留一条，其它注释掉
    # ============================================================
    image: ghcr.io/zxggh/fnsmartfan:latest
    # image: docker.io/<你的用户名>/fnsmartfan:latest
    # image: smartfan:latest   ← 纯本地离线模式（需要先 docker load tar）

    # ============================================================
    # 启动时是否自动拉取最新镜像
    #   always : 每次启动容器前都拉一次（保证最新，但可能慢几秒）
    #   never  : 只拉已经在本地的，完全不碰网络（离线/防401用）
    #   missing: 本地没有时才拉（默认行为，飞牛 Compose 版本太老不支持
    #            pull_policy 字段时，请注释掉整段，改为手动在 NAS 界面
    #            容器 → 镜像 → 拉取镜像 填写完整地址拉取）
    # ============================================================
    # pull_policy: always

    # 自动重启
    restart: always

    # 端口映射
    ports:
      - "8780:8780"

    # USB 串口：特权模式自动识别 /dev/ttyACM*
    privileged: true

    # 数据持久化卷
    volumes:
      - smartfan-data:/app

    # 时区
    environment:
      - TZ=Asia/Shanghai

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-s", "-m", "3", "http://127.0.0.1:8780/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 日志限制
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  smartfan-data:
    driver: local
