# ============================================================
# SmartFan 智能风扇控制器 - Docker Compose 远程镜像版
#
# 特性：
#   ✅ image 直接指向 ghcr.io / docker.io 等远程镜像仓库
#   ✅ 每次 compose up 时自动拉最新（飞牛 Compose 支持 pull_policy 时）
#   ✅ 完全不用再导入/导出 tar，更新就两步：Push → NAS 点"重新拉取+重启"
#
# ⚠ 当前仓库真实镜像地址（Actions 构建成功后自动推送）：
#    主镜像 (GHCR) : ghcr.io/zxggh/fnsmartfan:latest  ✅ 2026-08-26 起已启用
#    DockerHub     : (未配置, 需要的话自己改 workflow 加 docker.io 登录)
#    本地离线镜像  : fnsmartfan:v2 / fnsmartfan:golden (docker commit 后使用)
# ============================================================

services:
  smartfan:
    container_name: smartfan

    # ============================================================
    # 远程镜像地址（GitHub Actions 构建 → ghcr.io/zxggh/fnsmartfan:latest）
    # 如需切本地镜像: image: fnsmartfan:v2
    # ============================================================
    image: ghcr.io/zxggh/fnsmartfan:latest

    # ============================================================
    # ⚠ 本镜像内置的 entrypoint 会：
    #   - 启动时自动把 requirements 装到镜像层的 venv
    #   - 自动从 /data 卷接管 config.yaml（空卷时自动拷贝模板）
    # 所以这里不要覆盖 entrypoint，直接用默认启动即可
    # ============================================================
    # entrypoint: bash -c "..."

    # 自动重启
    restart: always

    # 端口映射
    ports:
      - "8780:8780"

    # ── 三保险 USB 控制器 + HDD 温度访问权限 ──
    #   保险 A (特权模式): 给容器完整权限访问宿主机 /dev
    #   保险 B (显式设备映射 0~9 全覆盖): ttyACM0~9 + ttyUSB0~9
    #           Docker Compose 写不存在的节点不会报错, 会自动跳过!
    #   保险 C (宿主机 /dev 只读挂载) : 看 volumes 下 /dev:/dev-host-dev:ro (兜底中的兜底)
    privileged: true
    devices:
      # ttyACM 0~9 全覆盖
      - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/ttyACM1:/dev/ttyACM1"
      - "/dev/ttyACM2:/dev/ttyACM2"
      - "/dev/ttyACM3:/dev/ttyACM3"
      - "/dev/ttyACM4:/dev/ttyACM4"
      - "/dev/ttyACM5:/dev/ttyACM5"
      - "/dev/ttyACM6:/dev/ttyACM6"
      - "/dev/ttyACM7:/dev/ttyACM7"
      - "/dev/ttyACM8:/dev/ttyACM8"
      - "/dev/ttyACM9:/dev/ttyACM9"
      # ttyUSB 0~9 全覆盖
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyUSB1:/dev/ttyUSB1"
      - "/dev/ttyUSB2:/dev/ttyUSB2"
      - "/dev/ttyUSB3:/dev/ttyUSB3"
      - "/dev/ttyUSB4:/dev/ttyUSB4"
      - "/dev/ttyUSB5:/dev/ttyUSB5"
      - "/dev/ttyUSB6:/dev/ttyUSB6"
      - "/dev/ttyUSB7:/dev/ttyUSB7"
      - "/dev/ttyUSB8:/dev/ttyUSB8"
      - "/dev/ttyUSB9:/dev/ttyUSB9"
    volumes:
      - smartfan-data:/data
      # 保险 C · 必挂: 宿主机 /dev 整卷只读进容器, 拔插任何口/任何编号 100% 能识别
      - /dev:/dev-host-dev:ro

    # 用 root 用户运行，避免 sg dialout / 串口权限、/data 卷权限各种问题
    user: root

    # 时区
    environment:
      - TZ=Asia/Shanghai

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-s", "-m", "3", "http://127.0.0.1:8780/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # 日志限制
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  smartfan-data:
    driver: local
