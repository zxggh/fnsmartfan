# ============================================================
# SmartFan 智能风扇控制器 - Docker Compose 远程镜像版
#
# 特性：
#   ✅ image 直接指向 ghcr.io / docker.io 等远程镜像仓库
#   ✅ 每次 compose up 时自动拉最新（飞牛 Compose 支持 pull_policy 时）
#   ✅ 完全不用再导入/导出 tar，更新就两步：Push → NAS 点"重新拉取+重启"
#
# ⚠ 当前仓库真实镜像地址（Actions 构建成功后自动推送）：
#    主镜像 (GHCR) : ghcr.io/zxggh/fnsmartfan:latest
#    DockerHub     : docker.io/<你的用户名>/fnsmartfan:latest
#    私有镜像      : registry.example.com/<你的用户名>/fnsmartfan:latest
# ============================================================

services:
  smartfan:
    container_name: smartfan

    # ============================================================
    # 远程镜像地址：
    #   先用 smartfan（已存在、立刻能拉），等 Actions 重新构建出 fnsmartfan
    #   后再改回 fnsmartfan 一行
    # ============================================================
    image: ghcr.io/zxggh/smartfan:latest
    # image: ghcr.io/zxggh/fnsmartfan:latest

    # ============================================================
    # ⚠ 本镜像内置的 entrypoint 会：
    #   - 启动时自动把 requirements 装到镜像层的 venv
    #   - 自动从 /data 卷接管 config.yaml（空卷时自动拷贝模板）
    # 所以这里不要覆盖 entrypoint，直接用默认启动即可
    # ============================================================
    # entrypoint: bash -c "..."

    # 自动重启
    restart: always

    # 端口映射
    ports:
      - "8780:8780"

    # USB 串口：特权模式自动识别 /dev/ttyACM*
    privileged: true

    # 用 root 用户运行，避免 sg dialout / 串口权限、/data 卷权限各种问题
    user: root

    # 数据持久化卷（⚠ 只挂 /data，不要挂 /app，
    # 否则会把镜像里带依赖的 venv 覆盖掉导致 yaml 等包缺失）
    volumes:
      - smartfan-data:/data

    # 时区
    environment:
      - TZ=Asia/Shanghai

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-s", "-m", "3", "http://127.0.0.1:8780/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # 日志限制
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  smartfan-data:
    driver: local
