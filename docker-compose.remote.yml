# ============================================================
# SmartFan 智能风扇控制器 - 【新设备一键部署专用 Compose 文件】
#
# 用途: 拿到一台从未装过 SmartFan 的全新 NAS (飞牛/群晖/绿联/极空间等),
#       直接上传本文件到 NAS 容器 Compose 界面, 不用 SSH, 不用改一行, 点确定即可部署
#
# 部署镜像: 默认使用 Docker Hub 公共仓库 (任何 NAS 品牌/加速源都能匿名拉取, 100% 通用)
#           zxggh/fnsmartfan:latest (等价于 docker.io/zxggh/fnsmartfan:latest)
#           备用仓库: ghcr.io/zxggh/fnsmartfan:latest (国内部分 NAS 可能需要 PAT 登录)
#
# 使用方法(全程 NAS Web 界面, 无需命令行, 推荐):
#   1. 打开 NAS Web 管理 → 容器 → 左侧菜单点 Compose (或 Stack)
#   2. 点右上角 【+ 创建项目】
#   3. 项目名称填: smartfan (随意, 建议保持这个方便辨识)
#   4. 【路径】选择你放文件的目录, 例如 /vol1/1000/个人/smart fan
#   5. 【文件上传模式】选择本文件 (docker-compose.remote.yml)
#   6. 点【确定】, NAS 会自动:
#      → 拉取 zxggh/fnsmartfan:latest (Docker Hub 公共镜像, 匿名, 不用登录)
#      → 创建 smartfan-data 数据卷(存放配置, 容器删了也不丢)
#      → 启动容器并加入开机自启
#   7. 浏览器打开 http://NAS_IP:8780 就能看到 Web UI
#
# 更简单的飞牛 NAS 部署 (不用 compose 文件, 纯点鼠标 1 分钟):
#   1. NAS → 容器 → 【镜像仓库】搜索框搜: zxggh/fnsmartfan → 找到后点【拉取】
#   2. 拉完回到【镜像】列表 → 点这一行右侧【创建容器】
#   3. 参数填写: 名称=smartfan / 端口=8780:8780 / 勾特权模式 / 用户=root
#                / 卷(smartfan-data→/data, /dev→/dev-host-dev只读)
#                / 设备映射(ttyACM0/1, ttyUSB0/1, 没入口可跳过, 特权+卷已兜底)
#                / 环境变量 TZ=Asia/Shanghai / 重启策略 always
#   4. 点【创建并启动】→ 打开 http://NAS_IP:8780
#
# 常见问题:
#   ❓ Docker Hub 拉取失败 (超时/连接失败):
#      → 解决 A (推荐): 在 NAS Docker 设置里切换国内加速源 (阿里云/中科大/163)
#      → 解决 B (飞牛专用): 直接用"更简单的飞牛 NAS 部署"上面 GUI 搜索拉取 (走飞牛代理缓存)
#      → 解决 C (离线): Windows 本地 docker pull zxggh/fnsmartfan:latest
#                      → docker save zxggh/fnsmartfan:latest -o fnsmartfan.tar
#                      → NAS 容器 → 镜像 → 导入 tar → image 改成 zxggh/fnsmartfan:latest
#   ❓ 启动后 HDD 温度不显示 (显示 N/A/--):
#      → 容器镜像已预装 smartmontools, 首次启动需等待 10~15 秒采集完成
#      → 若仍无值, 检查容器创建时是否勾选了"特权模式"以及挂了 /dev → /dev-host-dev (只读)
# ============================================================

services:
  smartfan:
    container_name: smartfan

    # ↓↓↓ 公共镜像默认地址: Docker Hub (匿名拉取, 所有 NAS 品牌通用) ↓↓↓
    # GitHub Actions 每次 main 分支提交代码后, 会自动构建并同时推送到两个仓库:
    #   ✅ 主仓库: zxggh/fnsmartfan:latest (Docker Hub, 默认用这个)
    #   🆗 备仓库: ghcr.io/zxggh/fnsmartfan:latest (GHCR, 国内网络受限的 NAS 可手动换这行)
    image: zxggh/fnsmartfan:latest

    # 开机自启
    restart: always

    # Web UI 端口: NAS_IP:8780
    ports:
      - "8780:8780"

    # ── USB 控制器 + HDD 温度访问权限 ──
    # 特权模式 + 显式设备映射 + 宿主机整个 /dev 挂载(3 保险)
    # 这样控制器随便拔插端口、HDD 用 smartctl 读温度都能正常工作
    privileged: true
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/ttyACM1:/dev/ttyACM1"
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    volumes:
      # 1) 数据卷: 存放 config.yaml + 开关状态 + 断连日志, 容器重建不丢失
      - smartfan-data:/data
      # 2) 宿主机 /dev → 容器 /dev-host-dev (只读)
      #    容器里 smartctl 通过 /dev-host-dev/sd* 读取宿主机硬盘 SMART 温度
      #    拔插 USB 后 /dev-host-dev/ttyACM* 也自动同步, 不用重启容器
      - /dev:/dev-host-dev:ro

    # root 用户: 跳过 sg dialout/sg disk 密码提示, 串口和 SMART 权限兜底
    user: root

    # 时区 (上海, 日志时间与 NAS 系统一致)
    environment:
      - TZ=Asia/Shanghai

    # 健康检查: 30 秒一次 API 检测, 连续失败 3 次标记 unhealthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-m", "3", "http://127.0.0.1:8780/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # 日志轮转: 单文件 10MB, 最多 5 份, 防止占满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  smartfan-data:
    driver: local
