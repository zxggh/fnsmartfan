name: 构建并发布 SmartFan Docker 镜像到 GHCR + Docker Hub

# 触发条件：
#   - 推送代码到 main 分支 → 自动打 latest + 日期版本标签并发布
#   - 打 v* 标签（如 v1.0.0）→ 自动打对应版本号标签并发布
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    # 也可以在 Actions 页面手动点「Run workflow」触发

# 所需权限（必须，GHCR 写入需要）
permissions:
  contents: read
  packages: write

env:
  # 镜像名（会自动拼成 ghcr.io/<仓库所有者>/fnsmartfan:标签 以及 docker.io/<用户>/fnsmartfan:标签）
  IMAGE_NAME: fnsmartfan

jobs:
  build-and-push:
    name: 构建并推送
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（用于多平台构建：amd64 + arm64，飞牛x86和ARM都能拉）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ════════════════════════════════════════════════
      # 新增: 登录 Docker Hub (部署给普通用户用的公共地址)
      #       在 GitHub Secrets 里添加 DOCKERHUB_USERNAME + DOCKERHUB_TOKEN 后生效
      #       如果没添加这两个 secret, 这一步自动跳过, 不影响 GHCR 推送
      # ════════════════════════════════════════════════
      - name: 登录 Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取镜像元数据（标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 双目标仓库: GHCR(给懂的用户) + Docker Hub(普通用户默认地址, 国内加速源都支持)
          # 第二行 Docker Hub 的地址只有配置了 DOCKERHUB_USERNAME 才会真正生成标签, 否则是空字符串会被忽略
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            # tag=v1.2.3 → 镜像标签 1.2.3
            type=semver,pattern={{version}}
            # 推送 main 分支 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 每次构建带日期+短commit，方便回溯
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 同时构建 x86_64 (主流NAS) 和 arm64 (树莓派/部分ARM NAS)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存加速，第二次构建通常 10 秒内完成
          cache-from: type=gha
          cache-to: type=gha,mode=max
